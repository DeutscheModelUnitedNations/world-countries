name: Publish

# Publishes to npm via trusted publishing (OIDC) — no NPM_TOKEN secret.
# Trigger: push a version tag, e.g. `npm version patch && git push --follow-tags`.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # REQUIRED: lets the runner mint the OIDC token npm exchanges

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # NOTE: intentionally NO `registry-url` here. registry-url makes setup-node
      # write an .npmrc with `_authToken=${NODE_AUTH_TOKEN}`, and that token path
      # suppresses OIDC (npm then does a tokenless/invalid publish → misleading
      # E404 on scoped packages). Pure OIDC needs no .npmrc and no NODE_AUTH_TOKEN.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Trusted publishing needs npm >= 11.5.0; the runner's bundled npm is older.
      - name: Upgrade npm for trusted publishing
        run: npm install -g npm@11
      - name: Show toolchain versions
        run: node -v && npm -v && npm config get registry
      - run: npm install
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      # --provenance forces the OIDC-backed provenance path; if OIDC is not
      # available this fails with a clear error instead of silently falling back.
      - run: npm publish --provenance
