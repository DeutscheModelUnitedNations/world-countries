name: Publish

# Publishes to npm via trusted publishing (OIDC) — no NPM_TOKEN secret.
# Trigger: push a version tag, e.g. `npm version patch && git push --follow-tags`.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # REQUIRED: lets the runner mint the OIDC token npm exchanges

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: 'https://registry.npmjs.org'
      # Trusted publishing needs npm >= 11.5.0. Pin to npm@11 rather than @latest:
      # npm@latest (12.x) requires Node >= 22.22.2 and breaks on older runners,
      # whereas npm@11 covers the OIDC flow and stays broadly Node-compatible.
      # Do NOT set NODE_AUTH_TOKEN anywhere — its absence is what makes npm use OIDC.
      - name: Upgrade npm for trusted publishing
        run: npm install -g npm@11
      - run: npm install
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      # Provenance is attached automatically under trusted publishing.
      - run: npm publish
